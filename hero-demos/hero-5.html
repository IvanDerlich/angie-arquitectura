<script>
const title=document.getElementById('title'),text='Espacios para habitar con calma';text.split(' ').forEach((word,wi)=>{const wordSpan=document.createElement('span');wordSpan.className='word';word.split('').forEach(char=>{const span=document.createElement('span');span.textContent=char;wordSpan.appendChild(span);});title.appendChild(wordSpan);if(wi<text.split(' ').length-1)title.appendChild(document.createTextNode(' '));});

const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let w=canvas.width=window.innerWidth,h=canvas.height=window.innerHeight,mouseX=w/2,mouseY=h/2,scrollY=0,time=0;window.addEventListener('resize',()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight});canvas.addEventListener('pointermove',e=>{mouseX=e.clientX;mouseY=e.clientY});window.addEventListener('scroll',()=>{scrollY=window.pageYOffset});

function drawFloor(y,depth){const parallaxX=(mouseX-w/2)*depth*0.05,parallaxY=(mouseY-h/2)*depth*0.03-scrollY*depth*0.2;ctx.save();ctx.translate(parallaxX,parallaxY);const floorW=600,floorX=w/2-floorW/2;
ctx.fillStyle=depth===1?'#C9A98C':'#E8DCCB';ctx.fillRect(floorX,y,floorW,15);ctx.strokeStyle='#2F4A63';ctx.lineWidth=3;ctx.strokeRect(floorX,y,floorW,15);
// Windows
for(let i=0;i<5;i++){const winX=floorX+80+i*100,winY=y-80,winW=60,winH=70;ctx.fillStyle='#7FA7C9';ctx.globalAlpha=0.7;ctx.fillRect(winX,winY,winW,winH);ctx.globalAlpha=1;ctx.strokeRect(winX,winY,winW,winH);ctx.beginPath();ctx.moveTo(winX+winW/2,winY);ctx.lineTo(winX+winW/2,winY+winH);ctx.moveTo(winX,winY+winH/2);ctx.lineTo(winX+winW,winY+winH/2);ctx.stroke()}
// Stairs
if(depth===1){ctx.strokeStyle='#2F4A63';ctx.lineWidth=2;for(let s=0;s<8;s++){const stairY=y-s*12;ctx.beginPath();ctx.moveTo(floorX+floorW-100,stairY);ctx.lineTo(floorX+floorW-50,stairY);ctx.stroke()}}
ctx.restore()}

function draw(){ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(0,h*0.6);const breath=Math.sin(time)*5;for(let floor=0;floor<5;floor++){const y=-floor*120+breath*floor;drawFloor(y,1-floor*0.15)}
ctx.restore();time+=0.02;requestAnimationFrame(draw)}
if(!window.matchMedia('(prefers-reduced-motion:reduce)').matches)draw();
</script>
