<script>
const title=document.getElementById('title'),text='Espacios para habitar con calma';text.split(' ').forEach((word,wi)=>{const wordSpan=document.createElement('span');wordSpan.className='word';word.split('').forEach(char=>{const span=document.createElement('span');span.textContent=char;wordSpan.appendChild(span);});title.appendChild(wordSpan);if(wi<text.split(' ').length-1)title.appendChild(document.createTextNode(' '));});

const wrap=document.getElementById('artWrap'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1;let w,h,mouseX=0,time=0;

function resize(){
  const r=wrap.getBoundingClientRect();
  w=r.width;
  h=r.height;
  canvas.width=w*dpr;
  canvas.height=h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0)
}
// Size canvas immediately
resize();
// Watch for future resizes
new ResizeObserver(entries => {
  if(entries[0].contentRect.width > 0) resize();
}).observe(wrap);

function handlePointer(e){
  const r=canvas.getBoundingClientRect();
  mouseX=e.clientX-r.left;
}
canvas.addEventListener('pointermove',handlePointer);
canvas.addEventListener('pointerdown',handlePointer);

function draw(){ctx.clearRect(0,0,w*dpr,h*dpr);const sunPos=time*0.8+mouseX*1.5,numArches=Math.ceil(w/110)+1;
for(let i=-1;i<numArches;i++){const x=i*110,archW=90,archH=h*0.85,base=h*0.92,lightDist=Math.abs((x+archW/2)-sunPos%(w+220)),lightIntensity=Math.max(0,1-lightDist/250);
// Crisp shadow polygon
if(lightIntensity>0.2){const shadowShift=(sunPos-x)/3;ctx.fillStyle=`rgba(47,74,99,${lightIntensity*0.25})`;ctx.beginPath();ctx.moveTo(x+20,base);ctx.lineTo(x+20+shadowShift,base+h*0.08);ctx.lineTo(x+archW-20+shadowShift,base+h*0.08);ctx.lineTo(x+archW-20,base);ctx.closePath();ctx.fill()}
// Arch structure
ctx.fillStyle=lightIntensity>0.5?'#F8F6F2':'#C9A98C';ctx.fillRect(x+8,base-archH,22,archH);ctx.fillRect(x+archW-30,base-archH,22,archH);ctx.beginPath();ctx.arc(x+archW/2,base-archH,archW/2-8,Math.PI,0);ctx.fill();ctx.strokeStyle='#2F4A63';ctx.lineWidth=3;ctx.stroke();ctx.fillRect(x,base-archH-12,archW,12);ctx.strokeRect(x,base-archH-12,archW,12);
// Light highlight
if(lightIntensity>0.4){ctx.fillStyle=`rgba(127,167,201,${lightIntensity*0.3})`;ctx.fillRect(x+8,base-archH,archW-16,archH)}}
time+=1.5;requestAnimationFrame(draw)}

if(!window.matchMedia('(prefers-reduced-motion:reduce)').matches)draw();
</script>
