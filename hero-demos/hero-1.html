<script>
const title=document.getElementById('title'),text='Espacios para habitar con calma';text.split(' ').forEach((word,wi)=>{const wordSpan=document.createElement('span');wordSpan.className='word';word.split('').forEach(char=>{const span=document.createElement('span');span.textContent=char;wordSpan.appendChild(span);});title.appendChild(wordSpan);if(wi<text.split(' ').length-1)title.appendChild(document.createTextNode(' '));});

const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let w=canvas.width=window.innerWidth,h=canvas.height=window.innerHeight,mouseX=w/2,mouseY=h/2,offset=0;window.addEventListener('resize',()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight});canvas.addEventListener('pointermove',e=>{mouseX=e.clientX;mouseY=e.clientY});

function drawWall(x1,y1,x2,y2,thick=4){ctx.strokeStyle='#2F4A63';ctx.lineWidth=thick;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function drawDoor(x,y,width,angle=0){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.strokeStyle='#7FA7C9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(width,0);ctx.stroke();ctx.beginPath();ctx.arc(0,0,width,0,Math.PI/2);ctx.stroke();ctx.restore()}
function drawDimLine(x1,y1,x2,y2,text){ctx.strokeStyle='#C9A98C';ctx.lineWidth=1;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#C9A98C';ctx.font='10px monospace';ctx.fillText(text,(x1+x2)/2,(y1+y2)/2-5)}

function draw(){ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2,scale=Math.min(w/1200,h/900);ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);ctx.globalAlpha=0.9+Math.sin(offset*0.5)*0.1;const wallOffset=Math.sin(offset)*3,doorAngle=Math.sin(offset*0.8)*0.1;
// Perimeter
drawWall(-500,-350+wallOffset,500,-350+wallOffset);drawWall(500,-350+wallOffset,500,350-wallOffset);drawWall(500,350-wallOffset,-500,350-wallOffset);drawWall(-500,350-wallOffset,-500,-350+wallOffset);
// Interior walls
drawWall(-500,-100,200,-100);drawWall(200,-350,200,150);drawWall(-200,-350,-200,350);drawWall(-500,100,500,100);drawWall(100,100,100,350);
// Doors
drawDoor(-100,-100,80,doorAngle);drawDoor(200,20,80,Math.PI/2+doorAngle);drawDoor(-200,200,80,doorAngle);
// Dimension lines
drawDimLine(-500,-380,500,-380,'10.00m');drawDimLine(520,-350,520,350,'7.00m');drawDimLine(-230,-350,-170,-350,'0.80m');
// Mouse interaction ripple
const dx=mouseX-cx,dy=mouseY-cy,dist=Math.sqrt(dx*dx+dy*dy);ctx.strokeStyle='#7FA7C9';ctx.lineWidth=2;ctx.globalAlpha=Math.max(0,1-dist/300);for(let r=20;r<150;r+=30){ctx.beginPath();ctx.arc(dx/scale,dy/scale,r,0,Math.PI*2);ctx.stroke()}
ctx.restore();offset+=0.02;requestAnimationFrame(draw)}
if(!window.matchMedia('(prefers-reduced-motion:reduce)').matches)draw();
