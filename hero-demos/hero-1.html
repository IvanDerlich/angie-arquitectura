<script>
const title=document.getElementById('title'),text='Espacios para habitar con calma';text.split(' ').forEach((word,wi)=>{const wordSpan=document.createElement('span');wordSpan.className='word';word.split('').forEach(char=>{const span=document.createElement('span');span.textContent=char;wordSpan.appendChild(span);});title.appendChild(wordSpan);if(wi<text.split(' ').length-1)title.appendChild(document.createTextNode(' '));});

const wrap=document.getElementById('artWrap'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1;let w,h,mouseX=0,mouseY=0,offset=0,ripples=[];
wrap.style.height=(window.innerHeight-80)+'px';
function resize(){
  const r=wrap.getBoundingClientRect();
  w=r.width;
  h=r.height;
  canvas.width=w*dpr;
  canvas.height=h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.dataset.ready='true'
}
// Size canvas immediately
resize();
// Watch for future resizes
new ResizeObserver(entries => {
  if(entries[0].contentRect.width > 0) resize();
}).observe(wrap);
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top;ripples.push({x:mouseX,y:mouseY,r:0,life:1})});

function drawWall(x1,y1,x2,y2,thick=6){ctx.strokeStyle='#2F4A63';ctx.lineWidth=thick;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function drawDoor(x,y,width,angle=0){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.strokeStyle='#7FA7C9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(width,0);ctx.stroke();ctx.beginPath();ctx.arc(0,0,width,0,Math.PI/2);ctx.stroke();ctx.restore()}
function drawDimLine(x1,y1,x2,y2,text){ctx.strokeStyle='#7FA7C9';ctx.lineWidth=2;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#2F4A63';ctx.font='14px monospace';ctx.fillText(text,(x1+x2)/2,(y1+y2)/2-8)}

function draw(){ctx.clearRect(0,0,w*dpr,h*dpr);const cx=w/2,cy=h/2,scale=Math.min(w/900,h/700);ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);const wallOffset=Math.sin(offset)*4,mouseInfluence=Math.sqrt((mouseX-cx)**2+(mouseY-cy)**2)/100;
// Outer walls - animated thickness
drawWall(-400,-280+wallOffset,400,-280+wallOffset,8+mouseInfluence);drawWall(400,-280+wallOffset,400,280-wallOffset,8+mouseInfluence);drawWall(400,280-wallOffset,-400,280-wallOffset,8+mouseInfluence);drawWall(-400,280-wallOffset,-400,-280+wallOffset,8+mouseInfluence);
// Interior walls
drawWall(-400,-80,150,-80,6);drawWall(150,-280,150,120,6);drawWall(-150,-280,-150,280,6);drawWall(-400,80,400,80,6);drawWall(80,80,80,280,6);drawWall(-400,180,400,180,6);
// Doors
drawDoor(-80,-80,70,Math.sin(offset*0.8)*0.15);drawDoor(150,20,70,Math.PI/2+Math.sin(offset*0.6)*0.12);drawDoor(-150,130,70,Math.sin(offset*0.7)*0.13);
// Dimension lines
drawDimLine(-400,-310,400,-310,'8.00m');drawDimLine(430,-280,430,280,'5.60m');drawDimLine(-180,-280,-120,-280,'0.90m');drawDimLine(-400,50,-400,110,'0.80m');
ctx.restore();

// Pointer ripples
ripples=ripples.filter(r=>{r.r+=6;r.life-=0.02;if(r.life<=0)return false;const alpha=r.life*0.8;ctx.strokeStyle=`rgba(127,167,201,${alpha})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();return true});

offset+=0.02;requestAnimationFrame(draw)}

if(!window.matchMedia('(prefers-reduced-motion:reduce)').matches)draw();
