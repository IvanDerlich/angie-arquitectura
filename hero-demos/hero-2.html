const wrapper=document.getElementById('ba-wrapper'),slider=document.getElementById('slider'),afterImg=document.getElementById('after-img');let autoPlay=true,autoPos=50;function updateSlider(pos){const pct=Math.max(0,Math.min(100,pos));slider.style.left=pct+'%';afterImg.style.clipPath='inset(0 '+(100-pct)+'% 0 0)';}function getPosition(e){const rect=wrapper.getBoundingClientRect(),x=e.clientX-rect.left;return(x/rect.width)*100;}function handlePointerDown(e){e.preventDefault();autoPlay=false;slider.setPointerCapture(e.pointerId);updateSlider(getPosition(e));}function handlePointerMove(e){if(slider.hasPointerCapture(e.pointerId)){e.preventDefault();updateSlider(getPosition(e));}}function handlePointerUp(e){if(slider.hasPointerCapture(e.pointerId)){slider.releasePointerCapture(e.pointerId);}}slider.addEventListener('pointerdown',handlePointerDown);slider.addEventListener('pointermove',handlePointerMove);slider.addEventListener('pointerup',handlePointerUp);slider.addEventListener('pointercancel',handlePointerUp);wrapper.addEventListener('pointerdown',(e)=>{if(e.target===wrapper||wrapper.contains(e.target)&&e.target!==slider){autoPlay=false;updateSlider(getPosition(e));}});function animate(){if(autoPlay){autoPos+=0.3*(autoPos>=70||autoPos<=30?-1:1);if(autoPos>70)autoPos=70;if(autoPos<30)autoPos=30;updateSlider(autoPos);}requestAnimationFrame(animate);}if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){animate();}else{autoPlay=false;updateSlider(50);}
