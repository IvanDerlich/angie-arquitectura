<script>
const title=document.getElementById('title'),text='Espacios para habitar con calma';text.split(' ').forEach((word,wi)=>{const wordSpan=document.createElement('span');wordSpan.className='word';word.split('').forEach(char=>{const span=document.createElement('span');span.textContent=char;wordSpan.appendChild(span);});title.appendChild(wordSpan);if(wi<text.split(' ').length-1)title.appendChild(document.createTextNode(' '));});

const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let w=canvas.width=canvas.offsetWidth,h=canvas.height=canvas.offsetHeight,mouseX=w/2,mouseY=h/2,time=0;window.addEventListener('resize',()=>{w=canvas.width=canvas.offsetWidth;h=canvas.height=canvas.offsetHeight});canvas.addEventListener('pointermove',e=>{const rect=canvas.getBoundingClientRect();mouseX=e.clientX-rect.left;mouseY=e.clientY-rect.top});

function isoBox(x,y,z,w,h,d,colors){ctx.save();ctx.translate(x+y*0.5,z-y*0.3);
// Top
ctx.fillStyle=colors[0];ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w,h*0.5);ctx.lineTo(w,-d*0.3);ctx.lineTo(0,-h*0.5-d*0.3);ctx.closePath();ctx.fill();ctx.strokeStyle='#2F4A63';ctx.lineWidth=2;ctx.stroke();
// Left
ctx.fillStyle=colors[1];ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,d);ctx.lineTo(0,h*0.5+d);ctx.lineTo(0,h*0.5);ctx.closePath();ctx.fill();ctx.stroke();
// Right
ctx.fillStyle=colors[2];ctx.beginPath();ctx.moveTo(w,h*0.5);ctx.lineTo(w,d+h*0.5);ctx.lineTo(w,d);ctx.lineTo(w,h*0.5);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}

function draw(){ctx.clearRect(0,0,w,h);ctx.save();const targetHeight=h*0.7,floorHeight=targetHeight/6,cx=w/2,cy=h*0.65,influence=(mouseX/w-0.5)*25,buildProgress=Math.abs(Math.sin(time*0.3));const floors=6;for(let floor=0;floor<floors;floor++){const progress=Math.max(0,Math.min(1,(buildProgress-floor*0.12)*2.5)),yOffset=-floor*floorHeight*progress+150*(1-progress),xOffset=influence*progress;ctx.save();ctx.translate(cx,cy-floor*floorHeight*progress);isoBox(-120+xOffset,yOffset,0,100,50,floorHeight*0.9,['#7FA7C9','#5A8DB0','#4A7D9F']);isoBox(40+xOffset,yOffset,0,80,50,floorHeight*0.9,['#C9A98C','#B39373','#9D7D63']);if(floor>0)isoBox(-30+xOffset,yOffset,0,60,50,floorHeight*0.8,['#E8DCCB','#D8CCB3','#C8BC9B']);ctx.restore()}
ctx.restore();time+=0.03;requestAnimationFrame(draw)}
